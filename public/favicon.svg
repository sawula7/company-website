<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#FEF9EE"/>
  <!-- Upper wing -->
  <ellipse cx="33" cy="28" rx="23" ry="11" fill="#FBBF24" transform="rotate(-38 33 28)"/>
  <!-- Lower wing -->
  <ellipse cx="27" cy="51" rx="15" ry="7.5" fill="#FBBF24" transform="rotate(-18 27 51)"/>
  <!-- Thorax -->
  <circle cx="50" cy="46" r="7" fill="#FBBF24"/>
  <!-- Abdomen -->
  <circle cx="66" cy="63" r="27" fill="#FBBF24"/>
  <!-- White stripes -->
  <path d="M 46 50 Q 66 41 87 50" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 42 62 Q 66 53 90 62" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Stinger -->
  <polygon points="48,79 29,94 52,86" fill="#FBBF24"/>
