<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Upper wing (large, tilted top-left) -->
  <ellipse cx="72" cy="55" rx="46" ry="22" fill="#FBBF24" transform="rotate(-38 72 55)"/>
  <!-- Lower wing (smaller, less angled) -->
  <ellipse cx="55" cy="98" rx="30" ry="15" fill="#FBBF24" transform="rotate(-18 55 98)"/>
  <!-- Thorax (small connector) -->
  <circle cx="98" cy="88" r="14" fill="#FBBF24"/>
  <!-- Abdomen (large circle, right-center) -->
  <circle cx="130" cy="118" r="54" fill="#FBBF24"/>
  <!-- White stripe arcs -->
  <path d="M 84 96 Q 130 78 176 96" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <path d="M 79 118 Q 130 100 181 118" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Stinger / tail -->
  <polygon points="90,155 52,182 96,168" fill="#FBBF24"/>
</svg>
